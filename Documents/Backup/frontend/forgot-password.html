<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Department of Physics, IIT Kharagpur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="admin-login-page">
  <main class="admin-login-layout">
    <section class="admin-login-brand-panel" aria-label="Portal introduction">
      <div class="admin-login-brand-card">
        <div class="admin-login-brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="presentation" focusable="false">
            <path d="M12 4 4 8l8 4 8-4-8-4Zm-5.5 6.25V14L12 17l5.5-3v-3.75L12 13l-5.5-2.75Z" />
          </svg>
        </div>
        <h1>IIT Portal</h1>
        <p>Enter your account email and we will send a one-time password reset link.</p>
      </div>
    </section>

    <section class="admin-login-form-panel" aria-label="Forgot password form">
      <div class="admin-login-form-wrap">
        <div class="admin-login-copy">
          <h2>Forgot password</h2>
          <p>Reset links expire after 1 hour and can only be used once.</p>
        </div>

        <form class="admin-login-form" id="forgot-password-form">
          <label for="forgot-email">Institute Email</label>
          <input id="forgot-email" name="email" type="email" placeholder="name@iit.ac.in" />
          <button type="submit" class="admin-login-submit" id="forgot-password-button">Send Reset Link</button>
        </form>
        <p class="admin-auth-message" id="forgot-password-message" aria-live="polite"></p>
        <div class="admin-login-meta">
          <a class="admin-text-link" id="back-to-login-link" href="/admin-login.html">Back to Login</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var API_BASE_URL = window.location.origin;
      var params = new URLSearchParams(window.location.search);
      var requestedRole = String(params.get("role") || "admin").toLowerCase();
      var backLink = document.getElementById("back-to-login-link");
      var form = document.getElementById("forgot-password-form");
      var button = document.getElementById("forgot-password-button");
      var message = document.getElementById("forgot-password-message");

      if (backLink && requestedRole === "superadmin") {
        backLink.href = "/admin-login.html?role=superadmin";
      }

      function setMessage(text, type, link) {
        message.classList.remove("is-error", "is-success");
        message.innerHTML = "";
        if (type) {
          message.classList.add(type);
        }
        if (!text) {
          return;
        }
        message.appendChild(document.createTextNode(text));
        if (link) {
          message.appendChild(document.createElement("br"));
          var anchor = document.createElement("a");
          anchor.href = link;
          anchor.textContent = link;
          anchor.className = "admin-text-link";
          message.appendChild(anchor);
        }
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        setMessage("", "");
        var email = document.getElementById("forgot-email").value.trim();
        if (!email) {
          setMessage("Email is required.", "is-error");
          return;
        }
        button.disabled = true;
        button.textContent = "Please wait...";
        try {
          var response = await fetch(API_BASE_URL + "/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email })
          });
          var result = await response.json();
          if (!response.ok) {
            setMessage(result.message || "Unable to send reset link.", "is-error");
            return;
          }
          setMessage(result.message || "If an account exists, a reset email has been sent.", "is-success", result.resetLink || "");
          form.reset();
        } catch (error) {
          setMessage("Unable to reach the server. Make sure the backend is running.", "is-error");
        } finally {
          button.disabled = false;
          button.textContent = "Send Reset Link";
        }
      });
    })();
  </script>
</body>
</html>
