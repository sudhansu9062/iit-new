<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Messages | Super Admin</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --shell-a: #f7f0e3;
      --shell-b: #cad8ef;
      --surface: #ffffffcf;
      --ink: #12213b;
      --muted: #5a6982;
      --line: #bfd0ea;
      --accent: #204fe7;
    }
    body.superadmin-page {
      margin: 0;
      min-height: 100vh;
      font-family: "Sora", "Segoe UI", sans-serif;
      background: radial-gradient(circle at 15% 15%, #fbf4e9 0%, transparent 42%), linear-gradient(145deg, var(--shell-a), var(--shell-b));
    }
    .sa-chat {
      max-width: 1220px;
      margin: 14px auto;
      background: var(--surface);
      border: 1px solid #d7e1f1;
      border-radius: 22px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: 82vh;
      box-shadow: 0 18px 44px rgba(18, 31, 67, 0.14);
      backdrop-filter: blur(6px);
    }
    .sa-left { border-right: 1px solid var(--line); display: flex; flex-direction: column; background: linear-gradient(180deg, #fbfdff, #f2f7ff); }
    .sa-head { padding: 16px; border-bottom: 1px solid var(--line); }
    .sa-head h3 { margin: 0 0 8px; color: var(--ink); }
    .sa-list { overflow: auto; }
    .sa-item { padding: 13px 15px; border-bottom: 1px solid #e6eef9; cursor: pointer; transition: background 150ms ease; }
    .sa-item:hover { background: #edf4ff; }
    .sa-item.is-active { background: linear-gradient(145deg, #d8e7ff, #ebf3ff); }
    .sa-item h4 { margin: 0 0 5px; font-size: 0.92rem; color: #16284a; }
    .sa-item p { margin: 0; font-size: 0.76rem; color: #5f6f8e; }
    .sa-right { display: flex; flex-direction: column; }
    .sa-meta { padding: 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; background: linear-gradient(135deg, #ffffffeb, #e9f1ffcf); }
    .sa-meta h3 { margin: 0 0 5px; color: var(--ink); }
    .sa-meta p { margin: 0; font-size: 0.78rem; color: #596b8a; }
    .sa-messages { flex: 1; overflow: auto; background: linear-gradient(180deg, #f2f7ff, #e8efff); padding: 14px; }
    .sa-date { width: max-content; margin: 12px auto; color: #53648a; font-size: 0.72rem; font-weight: 600; border: 1px solid #c8d6ef; background: #ffffffb8; border-radius: 999px; padding: 4px 10px; }
    .sa-msg { max-width: min(72%, 650px); margin-bottom: 10px; padding: 11px 13px; border-radius: 14px 14px 14px 4px; background: #fff; border: 1px solid #d0ddf2; box-shadow: 0 6px 13px rgba(19, 36, 72, 0.08); color: #1b2c4d; }
    .sa-msg.is-me { margin-left: auto; border-radius: 14px 14px 4px 14px; background: linear-gradient(145deg, #25459a, #345bc0); border-color: #23428f; color: #f3f7ff; }
    .sa-msg strong { display: block; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 5px; opacity: 0.9; }
    .sa-msg p { margin: 0; white-space: pre-wrap; line-height: 1.45; }
    .sa-msg img { margin-top: 8px; max-width: 100%; border-radius: 9px; border: 1px solid #abc0ec; }
    .sa-msg small { display: block; margin-top: 7px; font-size: 0.68rem; opacity: 0.82; }
    .sa-form { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 8px; background: #fbfdff; }
    .sa-form textarea { width: 100%; min-height: 82px; border: 1px solid #c0d1ec; border-radius: 12px; padding: 11px; font: inherit; resize: vertical; color: #13274b; }
    .sa-form textarea:focus { outline: none; border-color: #4f79df; box-shadow: 0 0 0 3px rgba(79, 121, 223, 0.16); }
    .sa-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .sa-actions button { border: 0; background: linear-gradient(145deg, #1e4ce7, #163ba8); color: #fff; border-radius: 11px; padding: 10px 15px; cursor: pointer; font-weight: 600; }
    .sa-status { margin: 0; font-size: 0.74rem; color: #586987; min-height: 18px; }
    .sa-back { color: var(--accent); text-decoration: none; font-size: 0.84rem; font-weight: 600; padding: 8px 11px; border: 1px solid #c8d8ff; border-radius: 999px; background: #f7faff; display: inline-block; }
    @media (max-width: 900px) {
      .sa-chat { grid-template-columns: 1fr; width: calc(100% - 12px); margin: 6px auto; border-radius: 14px; }
      .sa-left { max-height: 270px; }
      .sa-actions { flex-direction: column; align-items: stretch; }
      .sa-actions button { width: 100%; }
      .sa-msg { max-width: 88%; }
    }
  </style>
</head>
<body class="superadmin-page">
  <div class="sa-chat">
    <aside class="sa-left">
      <div class="sa-head">
        <h3>Admin Messages</h3>
        <a class="sa-back" href="./superadmin-dashboard.html">Back to Dashboard</a>
      </div>
      <div id="conversation-list" class="sa-list"></div>
    </aside>
    <section class="sa-right">
      <div class="sa-meta">
        <div>
          <h3 id="admin-name">Select a conversation</h3>
          <p id="admin-email"></p>
          <p id="admin-phone"></p>
          <p id="admin-designation"></p>
        </div>
      </div>
      <div id="message-list" class="sa-messages"></div>
      <form id="reply-form" class="sa-form">
        <textarea id="reply-text" placeholder="Reply to admin..."></textarea>
        <div class="sa-actions">
          <input id="reply-image" type="file" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif" />
          <button type="submit">Send</button>
        </div>
        <p id="reply-status" class="sa-status"></p>
      </form>
    </section>
  </div>

  <script>
    (async function () {
      var token = localStorage.getItem("iitPortalToken");
      if (!token) { window.location.href = "/admin-login.html?role=superadmin"; return; }

      var listRoot = document.getElementById("conversation-list");
      var msgRoot = document.getElementById("message-list");
      var adminName = document.getElementById("admin-name");
      var adminEmail = document.getElementById("admin-email");
      var adminPhone = document.getElementById("admin-phone");
      var adminDesignation = document.getElementById("admin-designation");
      var form = document.getElementById("reply-form");
      var replyText = document.getElementById("reply-text");
      var replyImage = document.getElementById("reply-image");
      var replyStatus = document.getElementById("reply-status");
      var currentConversationId = "";
      var conversations = [];
      var me = null;

      function esc(value) {
        return String(value || "").replace(/[&<>"']/g, function (char) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[char]; });
      }
      function fileToDataUrl(file) {
        return new Promise(function (resolve, reject) {
          if (!file) { resolve(""); return; }
          var reader = new FileReader();
          reader.onload = function () { resolve(String(reader.result || "")); };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }
      function formatTime(iso) { return new Date(iso).toLocaleString(); }
      function dateKey(iso) { return new Date(iso).toDateString(); }

      async function api(path, options) {
        var response = await fetch(window.location.origin + path, Object.assign({
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }
        }, options || {}));
        var data = await response.json();
        if (!response.ok) { throw new Error(data.message || "Request failed"); }
        return data;
      }

      function renderConversationList() {
        listRoot.innerHTML = conversations.length ? conversations.map(function (item) {
          var active = item.id === currentConversationId ? " is-active" : "";
          var lastText = item.lastMessage ? (item.lastMessage.text || (item.lastMessage.hasImage ? "Image attached" : "")) : "No messages yet.";
          return '<article class="sa-item' + active + '" data-conversation-id="' + esc(item.id) + '">' +
            '<h4>' + esc(item.adminProfile && item.adminProfile.name ? item.adminProfile.name : item.adminName) + '</h4>' +
            '<p>' + esc(lastText) + '</p>' +
            '<p>' + esc(new Date(item.updatedAt).toLocaleString()) + '</p>' +
          '</article>';
        }).join("") : '<p style="padding:12px;">No admin messages yet.</p>';
      }

      function renderMessages(conversation, profile) {
        adminName.textContent = profile && profile.name ? profile.name : "Unknown Admin";
        adminEmail.textContent = profile && profile.email ? ("Email: " + profile.email) : "";
        adminPhone.textContent = profile && profile.phone ? ("Phone: " + profile.phone) : "";
        adminDesignation.textContent = profile && profile.designation ? ("Designation: " + profile.designation) : "";

        var lastDate = "";
        msgRoot.innerHTML = (conversation.messages || []).map(function (item) {
          var currentDate = dateKey(item.createdAt);
          var dateLine = "";
          if (currentDate !== lastDate) {
            lastDate = currentDate;
            dateLine = '<div class="sa-date">' + esc(currentDate) + "</div>";
          }
          var mine = me && String(item.senderEmail || "").toLowerCase() === String(me.email || "").toLowerCase();
          return dateLine + '<article class="sa-msg' + (mine ? ' is-me' : '') + '">' +
            '<strong>' + esc(item.senderName || item.senderRole || "User") + '</strong>' +
            (item.text ? '<p>' + esc(item.text) + '</p>' : '') +
            (item.imageDataUrl ? '<img src="' + esc(item.imageDataUrl) + '" alt="Attachment" />' : '') +
            '<small>' + esc(formatTime(item.createdAt)) + '</small>' +
          '</article>';
        }).join("");
        msgRoot.scrollTop = msgRoot.scrollHeight;
      }

      async function openConversation(id) {
        currentConversationId = id;
        renderConversationList();
        var payload = await api("/api/support/conversations/" + encodeURIComponent(id));
        renderMessages(payload.conversation, payload.adminProfile || {});
      }

      async function refreshList() {
        var payload = await api("/api/support/conversations");
        conversations = payload.conversations || [];
        if (!currentConversationId && conversations.length) {
          currentConversationId = conversations[0].id;
        }
        renderConversationList();
        if (currentConversationId) {
          await openConversation(currentConversationId);
        }
      }

      listRoot.addEventListener("click", function (event) {
        var card = event.target.closest("[data-conversation-id]");
        if (!card) { return; }
        var id = card.getAttribute("data-conversation-id");
        if (id) { openConversation(id).catch(function (error) { replyStatus.textContent = error.message; }); }
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!currentConversationId) { return; }
        replyStatus.textContent = "Sending...";
        try {
          var imageDataUrl = await fileToDataUrl(replyImage.files[0]);
          await api("/api/support/messages", {
            method: "POST",
            body: JSON.stringify({ conversationId: currentConversationId, text: replyText.value, imageDataUrl: imageDataUrl })
          });
          replyText.value = "";
          replyImage.value = "";
          replyStatus.textContent = "Message sent.";
          await refreshList();
        } catch (error) {
          replyStatus.textContent = error.message;
        }
      });

      try {
        var mePayload = await api("/api/auth/me");
        me = mePayload.user || null;
        await refreshList();
        window.setInterval(refreshList, 6000);
      } catch (error) {
        replyStatus.textContent = error.message;
      }
    })();
  </script>
</body>
</html>
