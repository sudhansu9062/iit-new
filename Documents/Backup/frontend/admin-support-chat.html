<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Chat | Admin Portal</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --chat-bg-a: #f4efe4;
      --chat-bg-b: #cad9ee;
      --panel: #ffffffc9;
      --ink: #152238;
      --muted: #54637d;
      --line: #b8c8e3;
      --bubble-me-a: #23408f;
      --bubble-me-b: #3558ba;
      --bubble-other: #ffffff;
      --accent: #1f4eea;
    }
    body.portal-dashboard-page {
      margin: 0;
      min-height: 100vh;
      font-family: "Sora", "Segoe UI", sans-serif;
      background: radial-gradient(circle at 10% 10%, #f8f2e8 0%, transparent 45%), linear-gradient(145deg, var(--chat-bg-a), var(--chat-bg-b));
    }
    .support-wrap {
      width: min(1080px, calc(100% - 32px));
      margin: 22px auto;
      background: var(--panel);
      backdrop-filter: blur(8px);
      border: 1px solid #d8e0ef;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 18px 44px rgba(17, 35, 78, 0.13);
      animation: liftIn 380ms ease;
    }
    @keyframes liftIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .support-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 22px 24px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, #ffffffdd 0%, #edf3ffd8 100%);
    }
    .support-head h2 { margin: 0 0 6px; color: var(--ink); font-size: clamp(1.4rem, 2.5vw, 2rem); letter-spacing: 0.01em; }
    .support-head p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .support-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid #c6d6ff;
      background: #f6f9ff;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }
    .support-link:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(31, 78, 234, 0.2); }
    .support-messages {
      max-height: 60vh;
      overflow: auto;
      padding: 18px;
      background: linear-gradient(180deg, #f2f6ff 0%, #e8efff 100%);
    }
    .support-messages::-webkit-scrollbar { width: 10px; }
    .support-messages::-webkit-scrollbar-thumb { border-radius: 999px; background: #b9c8e8; }
    .support-date {
      width: max-content;
      margin: 14px auto;
      color: #4d5f87;
      font-size: 0.75rem;
      font-weight: 600;
      background: #ffffffb0;
      border: 1px solid #c8d5ef;
      border-radius: 999px;
      padding: 5px 10px;
    }
    .support-msg {
      max-width: min(74%, 640px);
      margin-bottom: 12px;
      padding: 12px 14px;
      border-radius: 16px 16px 16px 4px;
      background: var(--bubble-other);
      border: 1px solid #d0ddf3;
      color: #1a2b4a;
      box-shadow: 0 6px 14px rgba(19, 36, 69, 0.08);
      animation: bubbleIn 240ms ease;
    }
    .support-msg.is-me {
      margin-left: auto;
      border-radius: 16px 16px 4px 16px;
      background: linear-gradient(145deg, var(--bubble-me-a), var(--bubble-me-b));
      border-color: #224088;
      color: #eff4ff;
    }
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(5px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .support-msg strong { display: block; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; opacity: 0.9; }
    .support-msg p { margin: 0; white-space: pre-wrap; line-height: 1.45; }
    .support-msg small { display: block; margin-top: 7px; font-size: 0.7rem; opacity: 0.82; }
    .support-msg img { margin-top: 8px; max-width: 100%; border-radius: 10px; border: 1px solid #a6bbeb; }
    .support-form {
      border-top: 1px solid var(--line);
      padding: 14px;
      display: grid;
      gap: 10px;
      background: #fafdff;
    }
    .support-form textarea {
      width: 100%;
      min-height: 94px;
      resize: vertical;
      border: 1px solid #bfd0eb;
      border-radius: 14px;
      padding: 12px;
      font: inherit;
      color: #122547;
      background: #fff;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }
    .support-form textarea:focus { outline: none; border-color: #4e78df; box-shadow: 0 0 0 3px rgba(78, 120, 223, 0.16); }
    .support-actions { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .support-actions input[type="file"] { font-size: 0.8rem; color: #415375; }
    .support-actions button {
      border: 0;
      background: linear-gradient(145deg, #1f4eea, #173cae);
      color: #fff;
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(24, 62, 178, 0.28);
      transition: transform 150ms ease;
    }
    .support-actions button:hover { transform: translateY(-1px); }
    .support-status { margin: 0; font-size: 0.78rem; color: var(--muted); min-height: 18px; }
    @media (max-width: 720px) {
      .support-wrap { width: calc(100% - 14px); margin: 8px auto; border-radius: 16px; }
      .support-head { padding: 16px; flex-direction: column; align-items: flex-start; }
      .support-link { width: 100%; text-align: center; }
      .support-msg { max-width: 90%; }
      .support-actions { flex-direction: column; align-items: stretch; }
      .support-actions button { width: 100%; }
    }
  </style>
</head>
<body class="portal-dashboard-page">
  <div class="support-wrap">
    <div class="support-head">
      <div>
        <h2>Admin Support Chat</h2>
        <p>Direct conversation with Super Admin</p>
      </div>
      <a class="support-link" href="./admin-dashboard.html">Back to Dashboard</a>
    </div>
    <div id="support-messages" class="support-messages"></div>
    <form id="support-form" class="support-form">
      <textarea id="support-text" placeholder="Type your message..."></textarea>
      <div class="support-actions">
        <input id="support-image" type="file" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif" />
        <button type="submit">Send</button>
      </div>
      <p id="support-status" class="support-status"></p>
    </form>
  </div>
  <script>
    (async function () {
      var token = localStorage.getItem("iitPortalToken");
      if (!token) { window.location.href = "/admin-login.html"; return; }

      var messagesRoot = document.getElementById("support-messages");
      var form = document.getElementById("support-form");
      var textField = document.getElementById("support-text");
      var imageField = document.getElementById("support-image");
      var statusNode = document.getElementById("support-status");
      var conversationId = "";

      function esc(value) {
        return String(value || "").replace(/[&<>"']/g, function (char) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[char]; });
      }
      function formatTime(iso) { return new Date(iso).toLocaleString(); }
      function dateKey(iso) { return new Date(iso).toDateString(); }
      function fileToDataUrl(file) {
        return new Promise(function (resolve, reject) {
          if (!file) { resolve(""); return; }
          var reader = new FileReader();
          reader.onload = function () { resolve(String(reader.result || "")); };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function renderMessages(messages, meEmail) {
        var lastDate = "";
        messagesRoot.innerHTML = (messages || []).map(function (item) {
          var currentDate = dateKey(item.createdAt);
          var dateLine = "";
          if (currentDate !== lastDate) {
            lastDate = currentDate;
            dateLine = '<div class="support-date">' + esc(currentDate) + "</div>";
          }
          var mine = String(item.senderEmail || "").toLowerCase() === String(meEmail || "").toLowerCase();
          return dateLine + '<article class="support-msg' + (mine ? ' is-me' : '') + '">' +
            '<strong>' + esc(item.senderName || item.senderRole || "User") + '</strong>' +
            (item.text ? '<p>' + esc(item.text) + '</p>' : '') +
            (item.imageDataUrl ? '<img src="' + esc(item.imageDataUrl) + '" alt="Attachment" />' : '') +
            '<small>' + esc(formatTime(item.createdAt)) + '</small>' +
          '</article>';
        }).join("");
        messagesRoot.scrollTop = messagesRoot.scrollHeight;
      }

      async function api(path, options) {
        var response = await fetch(window.location.origin + path, Object.assign({
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }
        }, options || {}));
        var data = await response.json();
        if (!response.ok) { throw new Error(data.message || "Request failed"); }
        return data;
      }

      async function loadConversation() {
        var payload = await api("/api/support/conversations");
        conversationId = payload.conversation && payload.conversation.id ? payload.conversation.id : "";
        var me = await api("/api/auth/me");
        renderMessages(payload.conversation && payload.conversation.messages ? payload.conversation.messages : [], me.user && me.user.email);
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        statusNode.textContent = "Sending...";
        try {
          var imageDataUrl = await fileToDataUrl(imageField.files[0]);
          await api("/api/support/messages", {
            method: "POST",
            body: JSON.stringify({ conversationId: conversationId, text: textField.value, imageDataUrl: imageDataUrl })
          });
          textField.value = "";
          imageField.value = "";
          statusNode.textContent = "Message sent.";
          await loadConversation();
        } catch (error) {
          statusNode.textContent = error.message;
        }
      });

      try {
        await loadConversation();
        window.setInterval(loadConversation, 6000);
      } catch (error) {
        statusNode.textContent = error.message;
      }
    })();
  </script>
</body>
</html>
