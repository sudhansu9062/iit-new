<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Department of Physics, IIT Kharagpur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="admin-login-page">
  <main class="admin-login-layout">
    <section class="admin-login-brand-panel" aria-label="Portal introduction">
      <div class="admin-login-brand-card">
        <div class="admin-login-brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="presentation" focusable="false">
            <path d="M12 4 4 8l8 4 8-4-8-4Zm-5.5 6.25V14L12 17l5.5-3v-3.75L12 13l-5.5-2.75Z" />
          </svg>
        </div>
        <h1>IIT Portal</h1>
        <p>Create a new password for your account. This reset link works only once.</p>
      </div>
    </section>

    <section class="admin-login-form-panel" aria-label="Reset password form">
      <div class="admin-login-form-wrap">
        <div class="admin-login-copy">
          <h2>Reset password</h2>
          <p id="reset-password-summary">Checking your reset link...</p>
        </div>

        <form class="admin-login-form" id="reset-password-form" hidden>
          <label for="reset-password">New Password</label>
          <input id="reset-password" name="password" type="password" placeholder="At least 8 characters" />
          <label for="reset-password-confirm">Confirm Password</label>
          <input id="reset-password-confirm" name="confirmPassword" type="password" placeholder="Re-enter your new password" />
          <button type="submit" class="admin-login-submit" id="reset-password-button">Reset Password</button>
        </form>
        <p class="admin-auth-message" id="reset-password-message" aria-live="polite"></p>
        <div class="admin-login-meta">
          <a class="admin-text-link" href="/admin-login.html" id="reset-login-link">Back to Login</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var API_BASE_URL = window.location.origin;
      var params = new URLSearchParams(window.location.search);
      var token = String(params.get("token") || "").trim();
      var role = String(params.get("role") || "admin").toLowerCase();
      var summary = document.getElementById("reset-password-summary");
      var form = document.getElementById("reset-password-form");
      var message = document.getElementById("reset-password-message");
      var button = document.getElementById("reset-password-button");
      var loginLink = document.getElementById("reset-login-link");
      if (loginLink && role === "superadmin") {
        loginLink.href = "/admin-login.html?role=superadmin";
      }

      function setMessage(text, type) {
        message.textContent = text || "";
        message.classList.remove("is-error", "is-success");
        if (type) {
          message.classList.add(type);
        }
      }

      if (!token) {
        summary.textContent = "This password reset link is invalid or missing.";
        setMessage("Reset token is required.", "is-error");
        return;
      }

      fetch(API_BASE_URL + "/api/auth/reset-password/" + encodeURIComponent(token))
        .then(function (response) {
          return response.json().then(function (result) {
            if (!response.ok) {
              throw new Error(result.message || "Unable to validate reset link.");
            }
            return result;
          });
        })
        .then(function (result) {
          var reset = result.reset || {};
          summary.textContent = "Reset password for " + (reset.email || "your account") + ". This link expires at " + new Date(reset.expiresAt).toLocaleString("en-IN") + ".";
          form.hidden = false;
        })
        .catch(function (error) {
          summary.textContent = "This password reset link cannot be used.";
          setMessage(error.message, "is-error");
        });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        setMessage("", "");
        var password = document.getElementById("reset-password").value;
        var confirmPassword = document.getElementById("reset-password-confirm").value;
        if (password.length < 8) {
          setMessage("Password must be at least 8 characters long.", "is-error");
          return;
        }
        if (password !== confirmPassword) {
          setMessage("Passwords do not match.", "is-error");
          return;
        }
        button.disabled = true;
        button.textContent = "Please wait...";
        try {
          var response = await fetch(API_BASE_URL + "/api/auth/reset-password/" + encodeURIComponent(token), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: password })
          });
          var result = await response.json();
          if (!response.ok) {
            setMessage(result.message || "Unable to reset password.", "is-error");
            return;
          }
          setMessage(result.message || "Password reset successfully.", "is-success");
          form.hidden = true;
          summary.textContent = "Your password has been updated. You can return to the login page now.";
        } catch (error) {
          setMessage("Unable to reach the server. Make sure the backend is running.", "is-error");
        } finally {
          button.disabled = false;
          button.textContent = "Reset Password";
        }
      });
    })();
  </script>
</body>
</html>
