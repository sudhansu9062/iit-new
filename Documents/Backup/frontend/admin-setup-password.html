<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Admin Password | Department of Physics, IIT Kharagpur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="admin-login-page">
  <main class="admin-login-layout">
    <section class="admin-login-brand-panel" aria-label="Portal introduction">
      <div class="admin-login-brand-card">
        <div class="admin-login-brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="presentation" focusable="false">
            <path d="M12 4 4 8l8 4 8-4-8-4Zm-5.5 6.25V14L12 17l5.5-3v-3.75L12 13l-5.5-2.75Z" />
          </svg>
        </div>
        <h1>Admin Invitation</h1>
        <p>Set your password to activate your invited Admin account.</p>
      </div>
    </section>

    <section class="admin-login-form-panel" aria-label="Password setup">
      <div class="admin-login-form-wrap">
        <div class="admin-login-copy">
          <h2>Set your password</h2>
          <p id="invite-summary">Checking your invitation...</p>
        </div>

        <form class="admin-login-form" id="setup-form">
          <label for="setup-password">New Password</label>
          <input id="setup-password" name="password" type="password" placeholder="At least 8 characters" />

          <label for="setup-confirm-password">Confirm Password</label>
          <input id="setup-confirm-password" name="confirmPassword" type="password" placeholder="Repeat your password" />

          <button type="submit" class="admin-login-submit" id="setup-button">Activate Account</button>
        </form>
        <p class="admin-auth-message" id="setup-message" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = String(params.get("token") || "").trim();
      var summary = document.getElementById("invite-summary");
      var message = document.getElementById("setup-message");
      var form = document.getElementById("setup-form");
      var button = document.getElementById("setup-button");
      var passwordInput = document.getElementById("setup-password");
      var confirmInput = document.getElementById("setup-confirm-password");

      function setMessage(text, type) {
        message.textContent = text || "";
        message.classList.remove("is-error", "is-success");
        if (type) { message.classList.add(type); }
      }

      if (!token) {
        summary.textContent = "This invitation link is missing or invalid.";
        form.hidden = true;
        return;
      }

      fetch(window.location.origin + "/api/auth/invitations/" + encodeURIComponent(token))
        .then(function (response) { return response.json().then(function (data) { return { ok: response.ok, data: data }; }); })
        .then(function (result) {
          if (!result.ok) {
            summary.textContent = result.data.message || "This invitation is invalid.";
            form.hidden = true;
            return;
          }
          var invitation = result.data.invitation || {};
          summary.textContent = invitation.name
            ? ("Invite for " + invitation.name + " (" + (invitation.email || "") + ")")
            : "Set your password to activate your account.";
        })
        .catch(function () {
          summary.textContent = "Unable to validate your invitation right now.";
          form.hidden = true;
        });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        setMessage("", "");
        var password = passwordInput.value;
        var confirmPassword = confirmInput.value;
        if (password.length < 8) {
          setMessage("Password must be at least 8 characters long.", "is-error");
          return;
        }
        if (password !== confirmPassword) {
          setMessage("Passwords do not match.", "is-error");
          return;
        }
        button.disabled = true;
        button.textContent = "Please wait...";
        fetch(window.location.origin + "/api/auth/invitations/" + encodeURIComponent(token) + "/setup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: password })
        }).then(function (response) {
          return response.json().then(function (data) { return { ok: response.ok, data: data }; });
        }).then(function (result) {
          if (!result.ok) {
            setMessage(result.data.message || "Unable to set password.", "is-error");
            return;
          }
          setMessage(result.data.message || "Password set successfully.", "is-success");
          window.setTimeout(function () {
            // Redirect to the real HTML file so this works both when served
            // directly by nginx (static file) and when served via Node.js.
            // /admin-portal is a Node-only virtual route; nginx returns 404 for it.
            window.location.href = "/admin-login.html";
          }, 1200);
        }).catch(function () {
          setMessage("Unable to reach the server. Please try again.", "is-error");
        }).finally(function () {
          button.disabled = false;
          button.textContent = "Activate Account";
        });
      });
    })();
  </script>
</body>
</html>
